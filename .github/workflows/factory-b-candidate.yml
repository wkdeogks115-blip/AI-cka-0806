name: Factory B candidate checks
on:
  pull_request:
    paths:
      - 'factory-b/**'
      - '.github/workflows/factory-b-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Factory B repository-local checks
        run: |
          set -euo pipefail
          python -B factory-b/tests/repo_candidate_check.py
