name: Factory B candidate checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  candidate-checks:
    if: startsWith(github.head_ref, 'factory-b-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Factory B repository-local checks
        run: |
          set -euo pipefail
          python -B factory-b/tests/repo_candidate_check.py
