name: Factory B F5 Delivery Rehearsal

on:
  pull_request:
    paths:
      - 'factory-b/**'
      - '.github/workflows/factory-b-f5-rehearsal.yml'
  workflow_dispatch:

jobs:
  qualification-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify handoff qualification fixture
        run: python factory-b/tools/qualification_preflight.py
