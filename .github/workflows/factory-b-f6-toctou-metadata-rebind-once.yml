name: factory-b-f6-toctou-metadata-rebind-once

on:
  push:
    branches:
      - factory-b/f6-2-toctou-product-patch-20260818

permissions:
  contents: write

jobs:
  rebind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-b/f6-2-toctou-product-patch-20260818
          fetch-depth: 1
      - name: Rebind frozen candidate metadata to reviewed product patch bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old='426e9db69c00ed9b73a3a4afec318704fd4daf8c4b0c29f267c07bac05e3882b'
          new='113a1e3435ed30773d2a2423f45b5c57f8b790578242e023130b2bfd72f1fca8'
          paths=[
            Path('factory-b/qualification/F6_SELF_HOST_001/WORK_ORDER.json'),
            Path('factory-b/qualification/F6_SELF_HOST_001/ARTIFACT_CONTRACT.json'),
            Path('factory-b/qualification/F6_SELF_HOST_001/RELEASE_CONTRACT.json'),
          ]
          for p in paths:
            s=p.read_text(encoding='utf-8')
            if s.count(old) != 1:
              raise SystemExit(f'{p}: expected exactly one old candidate hash')
            p.write_text(s.replace(old,new), encoding='utf-8')
          p=Path('factory-b/qualification/F6_SELF_HOST_001/ARTIFACT_CONTRACT.json')
          s=p.read_text(encoding='utf-8')
          old_status='LOCAL_PATCH_TESTS_PASS_13_OF_13'
          if s.count(old_status) != 1:
            raise SystemExit('artifact contract: expected old test_status exactly once')
          p.write_text(s.replace(old_status,'PRODUCT_INTEGRATION_PATCH_TESTS_PASS_15_OF_15'), encoding='utf-8')
          PY
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          ART=Path('factory-b/artifacts/FACTORY_PACKAGE_INTEGRITY_VERIFIER_V1')
          ignore_dirs={'__pycache__','.pytest_cache','.git'}; ignore_suffix={'.pyc','.pyo'}
          rows=[]
          for p in sorted(ART.rglob('*'), key=lambda x:x.as_posix()):
            rel=p.relative_to(ART)
            if any(part in ignore_dirs for part in rel.parts) or not p.is_file() or p.suffix in ignore_suffix: continue
            rows.append((rel.as_posix(),hashlib.sha256(p.read_bytes()).hexdigest()))
          h=hashlib.sha256()
          for rel,d in rows:
            h.update(rel.encode()); h.update(b'\0'); h.update(d.encode()); h.update(b'\n')
          actual=h.hexdigest(); expected='113a1e3435ed30773d2a2423f45b5c57f8b790578242e023130b2bfd72f1fca8'
          assert actual==expected,(actual,expected)
          for name in ['WORK_ORDER.json','ARTIFACT_CONTRACT.json','RELEASE_CONTRACT.json']:
            obj=json.loads((Path('factory-b/qualification/F6_SELF_HOST_001')/name).read_text())
            assert obj['candidate_hash']==expected,(name,obj.get('candidate_hash'))
          PY
      - name: Remove one-time workflow and commit exact metadata patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/factory-b-f6-toctou-metadata-rebind-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add factory-b/qualification/F6_SELF_HOST_001/WORK_ORDER.json \
                  factory-b/qualification/F6_SELF_HOST_001/ARTIFACT_CONTRACT.json \
                  factory-b/qualification/F6_SELF_HOST_001/RELEASE_CONTRACT.json
          git commit -m 'rebind F6 candidate metadata to reviewed TOCTOU patch'
          git push origin HEAD:factory-b/f6-2-toctou-product-patch-20260818
