name: Factory B Preview v0.2.0

on:
  pull_request:
    paths:
      - 'factory-b/preview/v0.2.0/**'
      - '.github/workflows/factory-b-preview.yml'
  workflow_dispatch:

jobs:
  preview-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run standalone preview checks
        working-directory: factory-b/preview/v0.2.0
        run: python -B tests/run_tests.py
