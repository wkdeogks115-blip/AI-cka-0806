name: Factory B Transfer Qualification

on:
  pull_request:
    paths:
      - 'factory-b/transfer/**'
      - 'factory-b/src/factory_b/transfer_system.py'
      - 'factory-b/tools/transfer_qualification_preflight.py'
      - 'factory-b/qualification/TRANSFER_QUALIFICATION_001/**'
      - 'factory-b/qualification/handoff-independence-task-001/**'
      - '.github/workflows/factory-b-transfer-qualification.yml'
  workflow_dispatch:

jobs:
  pre-agent-transfer-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install pytest 'jsonschema>=4.20,<5'
      - name: Validate frozen transfer packet and unfinished baseline
        run: python factory-b/tools/transfer_qualification_preflight.py
