name: Scratch Run DB v0.2.2 Semantic Hardening

on:
  push:
    branches:
      - scratch/run-db-v0-2-sqlite-sim-20260813
    paths:
      - scratch/run_db_v0_2_2_postgres.sql
      - scratch/run_db_v0_2_2_adversarial.sql
      - scratch/run_db_v0_2_2_lineage_probe.sql
      - .github/workflows/scratch-run-db-v0-2-2.yml

permissions:
  contents: read

jobs:
  postgres-v0-2-2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Execute v0.2.2 schema and 15 semantic tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f scratch/run_db_v0_2_2_postgres.sql

  postgres-v0-2-2-negative-controls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Build bounded negative-control transaction
        run: |
          head -n -1 scratch/run_db_v0_2_2_postgres.sql > /tmp/v0_2_2_negative.sql
          cat scratch/run_db_v0_2_2_adversarial.sql >> /tmp/v0_2_2_negative.sql
          echo 'ROLLBACK;' >> /tmp/v0_2_2_negative.sql
      - name: Execute 12 fail-closed negative controls
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f /tmp/v0_2_2_negative.sql

  postgres-v0-2-2-lineage-probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Build cross-table lineage probe transaction
        run: |
          head -n -1 scratch/run_db_v0_2_2_postgres.sql > /tmp/v0_2_2_lineage.sql
          cat scratch/run_db_v0_2_2_lineage_probe.sql >> /tmp/v0_2_2_lineage.sql
          echo 'ROLLBACK;' >> /tmp/v0_2_2_lineage.sql
      - name: Confirm bounded lineage defects
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f /tmp/v0_2_2_lineage.sql
