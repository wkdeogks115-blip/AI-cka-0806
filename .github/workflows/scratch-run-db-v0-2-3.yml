name: Scratch Run DB v0.2.3 Lineage Hardening

on:
  push:
    branches:
      - scratch/run-db-v0-2-sqlite-sim-20260813
    paths:
      - scratch/run_db_v0_2_2_postgres.sql
      - scratch/run_db_v0_2_3_lineage_patch.sql
      - scratch/run_db_v0_2_3_negative_control.sql
      - .github/workflows/scratch-run-db-v0-2-3.yml

permissions:
  contents: read

jobs:
  postgres-v0-2-3-lineage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Build v0.2.3 composed transaction
        run: |
          head -n -1 scratch/run_db_v0_2_2_postgres.sql > /tmp/v0_2_3.sql
          cat scratch/run_db_v0_2_3_lineage_patch.sql >> /tmp/v0_2_3.sql
          echo 'ROLLBACK;' >> /tmp/v0_2_3.sql
      - name: Execute v0.2.3 lineage hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f /tmp/v0_2_3.sql
