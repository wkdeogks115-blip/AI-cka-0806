name: Scratch Run DB v0.2 Engine Validation

on:
  push:
    branches:
      - scratch/run-db-v0-2-sqlite-sim-20260813
    paths:
      - scratch/run_db_v0_2_sim.py
      - scratch/run_db_v0_2_postgres.sql
      - scratch/run_db_v0_2_defect_probe_fragment.sql
      - scratch/run_db_v0_2_1_postgres.sql
      - .github/workflows/scratch-run-db-v0-2-sim.yml

permissions:
  contents: read

jobs:
  sqlite-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic SQLite logic simulation
        run: python scratch/run_db_v0_2_sim.py

  postgres-validate-v0-2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Execute PostgreSQL v0.2 schema and critical guards
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f scratch/run_db_v0_2_postgres.sql

  postgres-adversarial-v0-2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Build adversarial probe transaction
        run: |
          head -n -1 scratch/run_db_v0_2_postgres.sql > /tmp/v0_2_probe.sql
          cat scratch/run_db_v0_2_defect_probe_fragment.sql >> /tmp/v0_2_probe.sql
          echo 'ROLLBACK;' >> /tmp/v0_2_probe.sql
      - name: Confirm expected v0.2 defects
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f /tmp/v0_2_probe.sql

  postgres-hardened-v0-2-1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Execute hardened PostgreSQL v0.2.1 candidate
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -f scratch/run_db_v0_2_1_postgres.sql
