name: Scratch Run DB v0.2 Engine Validation

on:
  push:
    branches:
      - scratch/run-db-v0-2-sqlite-sim-20260813
    paths:
      - scratch/run_db_v0_2_sim.py
      - scratch/run_db_v0_2_postgres.sql
      - scratch/run_db_v0_2_defect_probe_fragment.sql
      - scratch/run_db_v0_2_1_postgres.sql
      - scratch/run_db_v0_2_1_adversarial_fragment.sql
      - scratch/run_db_v0_2_1_query_validation_fragment.sql
      - scratch/run000001.schema.json
      - scratch/test_run000001_json_schema.py
      - .github/workflows/scratch-run-db-v0-2-sim.yml

permissions:
  contents: read

jobs:
  sqlite-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scratch/run_db_v0_2_sim.py

  postgres-validate-v0-2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          psql --version
      - env: {PGPASSWORD: postgres}
        run: psql -h localhost -U postgres -d postgres -f scratch/run_db_v0_2_postgres.sql

  postgres-adversarial-v0-2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
      - run: |
          head -n -1 scratch/run_db_v0_2_postgres.sql > /tmp/v0_2_probe.sql
          cat scratch/run_db_v0_2_defect_probe_fragment.sql >> /tmp/v0_2_probe.sql
          echo 'ROLLBACK;' >> /tmp/v0_2_probe.sql
      - env: {PGPASSWORD: postgres}
        run: psql -h localhost -U postgres -d postgres -f /tmp/v0_2_probe.sql

  postgres-hardened-v0-2-1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          psql --version
      - env: {PGPASSWORD: postgres}
        run: psql -h localhost -U postgres -d postgres -f scratch/run_db_v0_2_1_postgres.sql

  postgres-adversarial-v0-2-1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
      - run: |
          head -n -1 scratch/run_db_v0_2_1_postgres.sql > /tmp/v0_2_1_probe.sql
          cat scratch/run_db_v0_2_1_adversarial_fragment.sql >> /tmp/v0_2_1_probe.sql
          echo 'ROLLBACK;' >> /tmp/v0_2_1_probe.sql
      - env: {PGPASSWORD: postgres}
        run: psql -h localhost -U postgres -d postgres -f /tmp/v0_2_1_probe.sql

  postgres-query-validation-v0-2-1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
      - run: |
          head -n -1 scratch/run_db_v0_2_1_postgres.sql > /tmp/v0_2_1_query.sql
          cat scratch/run_db_v0_2_1_query_validation_fragment.sql >> /tmp/v0_2_1_query.sql
          echo 'ROLLBACK;' >> /tmp/v0_2_1_query.sql
      - env: {PGPASSWORD: postgres}
        run: psql -h localhost -U postgres -d postgres -f /tmp/v0_2_1_query.sql

  run000001-json-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5'
      - run: python scratch/test_run000001_json_schema.py
