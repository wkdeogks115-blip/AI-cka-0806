<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory B 바로사용 체험판 v0.2.0</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:980px;margin:32px auto;padding:0 18px;line-height:1.55}textarea,input,select,button{font:inherit}textarea{width:100%;min-height:90px}fieldset{margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}pre{white-space:pre-wrap;background:#f3f4f6;padding:14px;border-radius:8px}.muted{opacity:.72}</style></head><body>
<h1>Factory B v1 바로사용 체험판 v0.2.0</h1>
<p class="muted">UX_REHEARSAL_ONLY · NOT_ACTIVATION_EVIDENCE · 오프라인 단독 실행</p>
<label>아이디어<textarea id="idea">반복 사용 가능한 ZIP 무결성 검사 절차를 자산으로 만들고 싶다.</textarea></label>
<fieldset><legend>Artifact signal 하나를 선택</legend><select id="signal">
<option value="repeatable_procedure">반복 절차 → SKILL</option><option value="one_off_answer">1회 답변 → ANSWER</option><option value="policy_change">정책 → POLICY</option><option value="reusable_template">템플릿 → TEMPLATE</option><option value="formal_schema">스키마 → SCHEMA</option><option value="evaluation_harness">평가 → EVAL</option><option value="external_system_bridge">외부 연결 → ADAPTER</option><option value="executable_code">코드 → CODE</option><option value="end_user_product">제품 → PRODUCT</option><option value="research_only">조사 → RESEARCH</option></select></fieldset>
<div class="grid"><label>재사용<select id="reuse"><option>ONE_OFF</option><option selected>REPEATED</option><option>CROSS_PROJECT</option></select></label><label>품질영향<select id="impact"><option>LOW</option><option>MEDIUM</option><option selected>HIGH</option></select></label><label>절차화 가능<select id="procedural"><option value="true" selected>예</option><option value="false">아니오</option></select></label><label>제품화 가능<select id="productizable"><option value="false" selected>아니오</option><option value="true">예</option></select></label></div>
<p><button onclick="runPreview()">체험 판정</button></p><pre id="out">버튼을 누르면 결과가 표시됩니다.</pre>
<script>
const MAP={one_off_answer:"ANSWER",policy_change:"POLICY",repeatable_procedure:"SKILL",reusable_template:"TEMPLATE",formal_schema:"SCHEMA",evaluation_harness:"EVAL",external_system_bridge:"ADAPTER",executable_code:"CODE",end_user_product:"PRODUCT",research_only:"RESEARCH"};
function asset(t,reuse,impact,procedural,productizable){if(reuse==="ONE_OFF"&&(impact==="LOW"||impact==="MEDIUM"))return["ONE_OFF","low_reuse"];if(t==="ANSWER")return["ONE_OFF","answer_not_asset_by_default"];if(t==="RESEARCH")return[reuse==="ONE_OFF"?"ONE_OFF":"REFERENCE","research_reference_policy"];if(t==="POLICY")return["CREATE_POLICY","typed_reusable_asset"];if(t==="SKILL")return procedural?["CREATE_SKILL","typed_reusable_asset"]:["DEFER","skill_requires_proceduralizable_behavior"];if(t==="TEMPLATE")return["CREATE_TEMPLATE","typed_reusable_asset"];if(t==="SCHEMA")return["CREATE_SCHEMA","typed_reusable_asset"];if(t==="EVAL")return["CREATE_EVAL","typed_reusable_asset"];if(t==="ADAPTER")return["CREATE_ADAPTER","typed_reusable_asset"];if(t==="PRODUCT")return["CREATE_PRODUCT","typed_reusable_asset"];if(t==="CODE")return productizable?["CREATE_PRODUCT","reusable_code_packaged_as_product_asset"]:["DEFER","no_create_code_action_in_v1_contract_choose_packaging_first"];return["DEFER","conservative_default"]}
function runPreview(){const idea=document.getElementById("idea").value,sig=document.getElementById("signal").value;const t=MAP[sig],reuse=document.getElementById("reuse").value,impact=document.getElementById("impact").value;const procedural=document.getElementById("procedural").value==="true",productizable=document.getElementById("productizable").value==="true";const a=asset(t,reuse,impact,procedural,productizable);const result={preview_status:"READY_PREVIEW",artifact_type:t,assetization:{action:a[0],reason:a[1]},artifact_contract:{WHAT:idea,HOW:`artifact_type=${t}; assetization=${a[0]}`,APPROVAL_BOUNDARY:{final_approver:"EXTERNAL",factory_can_final_approve:false}},release:{target:"LOCAL",status:"ALLOWED_PREVIEW",candidate_only:true},actual_external_agent:"NOT_RUN",independent_review:"UNVERIFIED",active_release:false,activation_evidence:false};document.getElementById("out").textContent=JSON.stringify(result,null,2);return result}
</script></body></html>
